<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Perminov Studios - Your creative portfolio platform" />
    
    <!-- ========== FAVICON ========== -->
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png" />
    <link rel="manifest" href="favicon/site.webmanifest" />

    <!-- ========== EXTERNAL LIBRARIES ========== -->
    <!-- jQuery - DOM manipulation -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <!-- Lenis - Smooth scrolling -->
    <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1/bundled/lenis.min.js"></script>
    <!-- AOS - Animate on scroll (currently unused, kept for future) -->
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />

    <!-- ========== LOCAL STYLES ========== -->
    <link rel="stylesheet" href="./index/css/color.css" />
    
    <!-- ========== USAL ANIMATION LIBRARY ========== -->
    <!-- Loads text shimmer and fade animations - guarded against re-init -->
    <script>
      (function () {
        if (window.__USAL_LOADED) return;
        window.__USAL_LOADED = true;
        var s = document.createElement('script');
        s.id = 'usal-cdn';
        s.src = 'https://cdn.usal.dev/latest';
        s.defer = true;
        s.onload = function () {
          window.__USAL_INITIALIZED = true;
          try {
            if (window.usal && typeof window.usal.init === 'function') window.usal.init();
          } catch (e) {}
        };
        document.head.appendChild(s);
      })();
    </script>
    
    <title>Perminov Studios - Creative Portfolio Platform</title>
  </head>
  <body>
    <!-- ========================================================================
         PRELOADER OVERLAY
         Shows "Loading..." then "Welcome" before sliding up
         ======================================================================== -->
    <div id="box">
      <div
        id="text-container"
        data-usal="text-shimmer split-letter duration-2000 split-delay-100"
      >
        Loading ...
      </div>
    </div>

    <!-- ========================================================================
         NAVIGATION BAR
         Contains logo, nav links, and CTA button
         ======================================================================== -->
    <nav>
      <svg
        data-usal="fade-down delay-7500 once"
        id="logo"
        xmlns="http://www.w3.org/2000/svg"
        xmlns:xlink="http://www.w3.org/1999/xlink"
        xmlns:serif="http://www.serif.com/"
        width="100%"
        height="100%"
        viewBox="0 0 166 174"
        version="1.1"
        xml:space="preserve"
        style="
          fill-rule: evenodd;
          clip-rule: evenodd;
          stroke-linejoin: round;
          stroke-miterlimit: 2;
        "
      >
        <path
          fill="currentFill"
          d="M0.5,0.5l0,33.954c37.854,0 75.707,0.229 113.79,0.229c22.483,0 22.483,34.183 0,34.183c-21.106,0 -41.754,0.459 -63.089,0.459c-33.265,0 -49.554,20.189 -50.701,51.619l0,51.848l33.724,0l0,-51.848c0,-9.406 8.03,-17.206 16.977,-17.206l63.089,0c67.219,0 67.219,-103.237 0,-103.237l-113.79,0Z"
          style="
            fill-rule: nonzero;
            stroke: currentColor;
            stroke-opacity: 0;
            stroke-width: 1px;
          "
        />
      </svg>
      <ul data-usal="fade-down delay-7500 once">
        <li data-usal="fade-down delay-7600 once">About</li>
        <li data-usal="fade-down delay-7700 once">Projects</li>
        <li data-usal="fade-down delay-7800 once">Works</li>
        <li data-usal="fade-down delay-7900 once">Contact</li>
      </ul>

      <button data-usal="fade-down delay-8000 once" class="login-btn">
        <a
          href="https://discord.gg/bCb3behSFy" 
          target="_blank"
          data-usal="text-shimmer split-letter duration-2000 split-delay-100"
          class="btn-shine"
        >Get early access</a>
      </button>
    </nav>

    <!-- ========================================================================
         MAIN CONTENT AREA
         Hero section with background video and call-to-action
         ======================================================================== -->
    <main>
      <!-- Background Video Layer -->
      <div class="bg-video-wrapper" aria-hidden="true">
        <video id="bgVideo" autoplay muted loop playsinline preload="metadata">
          <source src="./index/videos/waves.mp4" type="video/mp4" />
        </video>
      </div>

      <!-- Hero Section -->
      <div class="first">
        <div class="shader"></div>

        <h2 data-usal="fade-up delay-7000 once">Perminov</h2>
        <h4 data-usal="fade-down delay-7500 once">STUDIOS</h4>

        <!-- Scroll Indicator Arrow -->
        <div class="scroll" id="scrollArrow" data-usal="fade-up delay-8500 once">
          <svg
            data-usal="fade loop"
            xmlns="http://www.w3.org/2000/svg"
            width="200"
            height="200"
            viewBox="0 0 17 17"
          >
            <path
              fill="currentColor"
              fill-rule="evenodd"
              d="M2.16 6.246c.225 0 .45.062.65.196l6.229 4.156l6.037-4.197a1.175 1.175 0 0 1 1.304 1.958l-6.688 4.63a1.174 1.174 0 0 1-1.304.002l-6.88-4.589a1.178 1.178 0 0 1 .652-2.156z"
            />
          </svg>
        </div>
      </div>
    </main>

    <!-- ========================================================================
         ADDITIONAL CONTENT SECTIONS
         Add more sections here as the site grows
         ======================================================================== -->
    <section>
    </section>

    <!-- ========================================================================
         FOOTER
         ======================================================================== -->
    <footer></footer>

    <!-- ========================================================================
         SCRIPTS
         ======================================================================== -->
    <script src="./index/js/script.js"></script>
  </body>
</html>
